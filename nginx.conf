server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-woff2;
    gzip_min_length 1024;

    # Docker / LB healthcheck
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite hashed assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webmanifest|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Optional same-origin proxy to backend (helps with CORS if you point client to /api)
    location /api/ {
        proxy_pass https://fitopiaapi.pythonanywhere.com/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host fitopiaapi.pythonanywhere.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # SPA: all routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
